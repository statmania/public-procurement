<script>
/* Blogkit: load blogkit.js from the site root, whatever the page depth. */
(function () {
  var m = document.querySelector('meta[name="quarto:offset"]');
  var base = m ? m.getAttribute('content') : '';
  if (base === './') base = '';
  var s = document.createElement('script');
  s.src = base + 'blogkit.js';
  s.dataset.base = base;
  document.body.appendChild(s);
})();
</script>
